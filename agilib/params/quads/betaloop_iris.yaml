# GEPRC Mark5, 225 mm motor-to-motor, 700 g all-up mass.
mass:               0.700
tbm_fr:             [ 0.07955, -0.07955, 0.0]
tbm_bl:             [-0.07955,  0.07955, 0.0]
tbm_br:             [-0.07955, -0.07955, 0.0]
tbm_fl:             [ 0.07955,  0.07955, 0.0]
inertia:            [0.0065, 0.0060, 0.0115]

# Qianfeng 5136 three-blade bench envelope: 29280 rpm and 16.91 N per rotor.
# The quadratic coefficient is the least-squares fit of all ten supplied
# rpm/thrust points; the Gazebo aerodynamic plugin uses the full lookup curve.
motor_omega_min:    0.0
motor_omega_max:    3066.19
motor_tau:          0.012
# Matches the 1000 deg/s ACTUAL max rate written into Betaflight by
# betaflight_sitl/run.py; the MPC must not ask for rates the inner loop
# cannot deliver.
omega_max:          [17.45, 17.45, 17.45]

thrust_map:         [1.80762e-6, 0.0, 0.0]
# Bench power / angular speed gives Q/T around 0.016-0.018 m over the useful
# high-throttle range. The plugin retains the full speed-dependent curve.
kappa:              0.0170
thrust_min:         0.0
thrust_max:         16.912
rotors_config:      "cross"

# Effective body-frame drag seen by the translational MPC.  This includes the
# frame drag and the four rotors' in-plane H-force from the Gazebo BEM model.
# Coefficients were identified from the sub-50 m/s SITL trajectory logs using
#   F_drag_xy = c1 * v + c3 * v^3
# and the existing induced-lift term in the MPC model.  Leaving these at zero
# made MPC predict vacuum dynamics while Gazebo applied 4-5 N of rotor drag at
# 10-11 m/s, producing a repeatable metre-scale position lag even though
# Betaflight tracked collective thrust and roll/pitch body rates.
aero_coeff_1:       [0.4002, 0.3833, 0.4314]
aero_coeff_3:       [0.000307, 0.000745, 0.001283]
aero_coeff_h:       0.01728
