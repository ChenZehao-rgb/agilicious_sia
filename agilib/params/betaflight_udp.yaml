# Betaflight 2026.6 SITL rc_packet destination.
host: 127.0.0.1
port: 9004

# BridgeBase command watchdog. A lock forces AUX1 low on the next packet.
timeout: 0.10
n_timeouts_for_lock: 4

# Betaflight rate profile must use ACTUAL rates. betaflight_sitl/run.py writes
# these into its isolated EEPROM copy and then reads them back, so this file is
# the single source of truth for the rate curve the bridge inverts.
#
# Center Sensitivity stays low for fine control around neutral; Max Rate has to
# cover the fastest reference trajectory in miscellaneous/datasets/ref_trajs,
# which peaks near 860 deg/s (CPC33_Z1).
center_rate_deg_s: [70.0, 70.0, 70.0]
max_rate_deg_s:    [1000.0, 1000.0, 1000.0]
expo_percent:      [0.0, 0.0, 0.0]

# Copy the Betaflight receiver deadband settings for exact rate inversion.
deadband: 0
yaw_deadband: 0

# Throttle mapping.  Betaflight scales stick throttle onto the motor output
# range [motor_idle, 1], and the Gazebo rotor plant produces thrust
# proportional to the square of that motor output:
#
#   motor = motor_idle + (1 - motor_idle) * u
#   collective_thrust = g * (motor / motor_hover)^2
#
# Inverting for the stick position u, with motor_hover the motor output that
# holds a hover:
#
#   u = (hover_throttle_motor * sqrt(collective_thrust / g) - motor_idle)
#       / (1 - motor_idle)
#   pwm = min_check + (2000 - min_check) * u
#
# motor_idle mirrors Betaflight's `motor_idle` setting (550 = 5.5%).  Ignoring
# it biases the feed-forward by about 5% of full throttle at both ends of the
# range, which matters once a trajectory asks for sustained high collective.
#
# hover_throttle is the active-range stick position that hovers. The static
# rotor needs about 1006 rad/s. The PI velocity servo tracks that speed under
# load: motor output = 1005.53 / 3108.6. With 5.5% idle this gives the
# active-range stick fraction (1005.53 / 3108.6 - 0.055) / 0.945.
motor_idle: 0.055
hover_throttle: 0.284093
min_check: 1050

# Betaflight inner-loop gains, written into the isolated EEPROM by run.py.
# Roll and pitch retain the existing tune. Yaw remains deliberately mild; the
# new aerodynamic plugin applies the measured power/omega reaction torque at
# each rotor instead of relying on joint-damping torque. A 15 s closed-loop
# hover test is stable, but these gains have not been flight-identified.
p_roll: 45
i_roll: 80
d_roll: 30
f_roll: 120
p_pitch: 47
i_pitch: 84
d_pitch: 34
f_pitch: 125
p_yaw: 2
i_yaw: 4
d_yaw: 0
f_yaw: 6
