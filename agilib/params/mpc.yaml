# Ideal collective-acceleration/body-rate MPC. Betaflight supplies the inner rate loop.
# Conservative initial weights from generic plant simulation; not verified on real hardware.
# Rotor-force MPC tuning results do not transfer; validate the actual rate loop.
timing: true
Q_pos_x: 200
Q_pos_y: 200
Q_pos_z: 500
Q_att_x: 5
Q_att_y: 5
Q_att_z: 200
Q_vel: 1.0
R_collective_thrust: 0.1  # input c=T/m, m/s^2
R_body_rates: [50.0, 50.0, 50.0]  # roll/pitch/yaw rate inputs, rad/s
exp_decay: 1.0
