# Hardware profile: remaining zero model/accuracy/geofence placeholders require measurements/test limits.
# Recorded evidence and remaining steps: ../analysis/hardware_diagnostic_20260924/README.md.
# Zero readiness thresholds never authorize override. Heading/declination confirmed by the operator below.
# Use diagnostic_only:=true to inspect sensors/MSP before the vehicle model is available.
# Dedicated MSP and MAVLink UARTs are mandatory. thrust_table is measured CSV relative to this file.
# bridge host/port/hover_throttle/motor_idle are compatibility fields; hardware uses the thrust table.
mode: hardware
flight:
  trajectory: ''
  thrust_table: ''
  sitl_delay_test: false
  shadow_only: true
  diagnostic_only: false
  record_bag: true
  bag_output: ''
pilot:
  pipeline:
    estimator:
      type: External
    sampler:
      type: Time
    controller:
      # Select MPC or GEO here, or override with controller:=GEO at launch.
      type: MPC
      parameter_sets:
        MPC:
          # Ideal rate/thrust model: no motor or inner-loop response prediction.
          timing: true
          Q_pos_x: 200
          Q_pos_y: 200
          Q_pos_z: 500
          Q_att_x: 5
          Q_att_y: 5
          Q_att_z: 200
          Q_vel: 1.0
          # Conservative initial weights from generic plant simulation; not verified on real hardware.
          R_collective_thrust: 0.1
          R_body_rates: [50.0, 50.0, 50.0]
          exp_decay: 1.0
        # Illustrative conservative starting gains, not validated on the real vehicle.
        # Tune and verify in shadow and on the CM5 before allowing hardware output.
        GEO:
          drag_compensation: false
          kpacc: [2.0, 2.0, 4.0]
          kdacc: [2.0, 2.0, 3.0]
          kpatt_z: 2.0
          kpatt_xy: 4.0
          kprate: [0.0, 0.0, 0.0]
          p_err_max: [0.5, 0.5, 0.5]
          v_err_max: [0.75, 0.75, 0.75]
          filter_sampling_frequency: 100
          filter_cutoff_frequency: 10
          max_tilt_rad: 0.35
    bridge:
      type: External
  # Both outer controllers use mass and command limits only.
  # thrust_min/max are per-motor equivalent N; collective acceleration bounds are 4F/m.
  # Inertia, geometry, kappa, motor and aerodynamic data belong to an optional plant model,
  # not this ideal outer-loop predictor. No unmeasured dynamics are filled with defaults.
  quadrotor:
    # Operator-reported takeoff mass including battery/payload, 2026-09-24: 734 g.
    mass: 0.734
    omega_max: [0.0, 0.0, 0.0]
    thrust_min: 0.0
    thrust_max: 0.0
  dt_min: 0.01
  outerloop_divisor: 1
  dt_telemetry: 0.1
  traj_type: poly_min_snap
  velocity_in_bodyframe: false
  takeoff_height: 1.0
  takeoff_threshold: 1.0
  start_land_speed: 0.5
  brake_deceleration: 3.0
  go_to_pose_mean_vel: 1.0
  stop_after_feedthrough: true
  feedthrough_timeout: 0.1
  viz_sampler_dt: 0.1
  sphere_size: 0.15
  pub_log_var: false
  guard:
    type: None
bridge:
  host: 127.0.0.1
  port: 9004
  timeout: 0.1
  n_timeouts_for_lock: 4
  # MSP 111/125/44 readback in hardware_20260924_150053_980611, rate profile 0.
  # These FC curve parameters do not establish the vehicle's safe omega_max.
  center_rate_deg_s: [70.0, 70.0, 70.0]
  max_rate_deg_s: [670.0, 670.0, 670.0]
  expo_percent: [0.0, 0.0, 0.0]
  deadband: 0
  yaw_deadband: 0
  motor_idle: 0.0
  hover_throttle: 0.5
  min_check: 1050
fusion:
  imu_acceleration_variance: 0.1
  imu_angular_velocity_variance: 0.0001
  ekf_process_position_variance: [1.0e-6, 1.0e-6, 1.0e-6]
  ekf_process_attitude_variance: [1.0e-6, 1.0e-6, 1.0e-6, 1.0e-6]
  ekf_process_velocity_variance: [0.001, 0.001, 0.001]
  ekf_process_gyro_bias_variance: [1.0e-9, 1.0e-9, 1.0e-9]
  ekf_process_acceleration_bias_variance: [1.0e-9, 1.0e-9, 1.0e-9]
  ekf_initial_attitude_variance: [0.01, 0.01, 0.01, 0.01]
  ekf_initial_gyro_bias_variance: [0.001, 0.001, 0.001]
  ekf_initial_acceleration_bias_variance: [0.01, 0.01, 0.01]
  rtk_position_variance: 0.0004
  rtk_velocity_variance: 0.0025
  rtk_heading_variance: 0.0001
  imu_initialization_duration: 3.0
  imu_initialization_samples: 1000
  imu_max_gyro_stddev: 0.02
  imu_max_gyro_bias: 0.15
  imu_max_acceleration_stddev: 0.2
  # 2026-09-26 stationary 3 s windows: gravity residual 0.537-0.622 m/s^2; allow 0.7 for EKF initialization.
  # Evidence: ../analysis/ekf_initialization_20260926/README.md. This does not calibrate acceleration.
  imu_gravity_tolerance: 0.7
  imu_initialization_max_speed: 0.3
  navigation_ready_updates: 30
  navigation_nis_threshold: 24.322
  max_horizontal_position_stddev: 0.0
  max_vertical_position_stddev: 0.0
  max_velocity_stddev: 0.0
  max_heading_stddev: 0.0
output:
  device: '/dev/ttyAMA0'
  baud: 115200
  msp.response_timeout_ms: 100.0
  msp.read_configuration: true
  msp.rc.enabled: true
  msp.rc.rate_hz: 25.0
  msp.status.enabled: true
  msp.status.rate_hz: 25.0
  msp.battery.enabled: true
  msp.battery.rate_hz: 2.0
  msp.attitude.enabled: false
  msp.analog.enabled: false
  msp.gps.enabled: false
mavlink:
  device: '/dev/ttyAMA2'
  baud: 921600
  gps_mode: gnss
  # GPS_RAW_INT.alt is MSL in the paired FC firmware; bag diagnostics contain finite MSL.
  # This selects the height datum, not a fixed height or a barometer measurement.
  altitude_source: msl
  imu_rate_hz: 500
  gps_rate_hz: 10
  attitude_rate_hz: 0
navigation:
  # M1025 GPS + IST8310 magnetometer (operator report, 2026-09-24).
  # The first bag was a handheld walk, not a stationary calibration.
  # Reported accuracy p95: horizontal 3.0773 m, vertical 4.34805 m, speed 1.5861 m/s.
  # Do not turn these observations into flight acceptance limits automatically.
  # Follow-up flight: ../analysis/hardware_flight_20260924_163013/README.md.
  origin_duration: 3.0
  origin_samples: 30
  origin_max_speed: 0.3
  # Operator confirmed true-north alignment and FC declination compensation after IST8310 calibration.
  # ROS applies no additional heading correction; this declaration is not inferred from heading_valid.
  heading_confirmed: true
  heading_correction_rad: 0.0
  fc_declination_applied: true
  horizontal_stddev: 1.0
  vertical_stddev: 2.0
  velocity_stddev: 0.3
  heading_stddev: 0.17453292519943295
  max_horizontal_accuracy: 0.0
  max_vertical_accuracy: 0.0
  max_velocity_accuracy: 0.0
evidence:
  # Zero-based AUX indices: AUX1=0, ..., AUX14=13; choose three distinct channels.
  arm_aux: 0
  auto_aux: 1
  kill_aux: 4
  aux_low: 1875
  aux_high: 2100
  rx_map: [0, 1, 3, 2, 4, 5, 6, 7]
  battery_timeout: 1.5
  geofence_min: [0.0, 0.0, 0.0]
  geofence_max: [0.0, 0.0, 0.0]
  expected_pid_profile: 1
  expected_rate_profile: 0
  # Fixed at 50 ms for this hardware policy; cannot be relaxed through configuration.
  expected_override_timeout_ms: 50
