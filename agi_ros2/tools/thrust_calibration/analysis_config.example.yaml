# Null means unverified: inspect reports the gap; no measured table is generated.
bf:
  timestamp_field: null
  timestamp_unit: null
  timestamp_meaning: null
  voltage_field: vbatLatest
  voltage_unit: null
  voltage_evidence: null
  decoder_quality_reviewed: false
  motor_fields: ['motor[0]', 'motor[1]', 'motor[2]', 'motor[3]']
  boundary_fields: []  # Add observed arm/profile/mode fields. Explicit sessions delimit other boundaries.
  axis:
    field: 'debug[3]'
    semantics: rx_range_rcdata
    debug_mode: null
    decode_scale: null
    axis_verified: false
    evidence: null
    firmware_match: null
    same_msp_rx_path_verified: false
    rx_smoothing: null
    rx_min: null
    rx_max: null
    rcdata_clip_min: null
    rcdata_clip_max: null
    quantization_rcdata: null
    valid_when: {}  # Require RX signal, channel validity, failsafe and no held-value evidence.
px4:
  timestamp_field: null
  timestamp_unit: null
  timestamp_meaning: null
  force_field: null
  unit: null
  sign: null
  offset: null
  zero_is_no_thrust: null
  calibration_evidence: null
  sample_seq_field: null
  independent_sample_rate: unknown
  valid_when: {}
# These are software example thresholds, not equipment acceptance limits. Freeze before held-out testing.
alignment:
  fit_drift: true
  max_drift_ppm: 500
  max_residual_s: 0.04
  minimum_uncertainty_s: 0.02
  max_outlier_edges: 1
  edge_check_radius_s: 0.3
  edge_min_rc: 20
  edge_min_force_n: 0.1
steady:
  transition_s: 0.5
  min_duration_s: 0.7
  min_force_samples: 15
  step_rc: 8
  motor_step: 40
  bf_max_gap_s: 0.05
  px4_max_gap_s: 0.08
  force_std_n: 0.05
  force_slope_n_s: 0.03
  rc_std: 2
  rc_slope_s: 2
  voltage_std_v: 0.05
  voltage_slope_v_s: 0.03
  motor_std: 5
  motor_slope_s: 5
  max_alignment_force_change_n: 0.03
  max_tare_drift_n: 0.05
fit:
  force_log_floor_n: 0.1
  relative_force_floor_n: 0.3
  rc_bin_width: 10
  min_points_per_bin: 6
  min_train_blocks: 3
  min_rc_bins: 3
  min_voltage_span_v: 1.0
  minimum_jitter_rc: 0.2
  max_design_condition: 100000
  p_min: -1
  p_max: 4
  max_p_standard_error: 0.2
  max_local_p_spread: 0.4
  max_bin_p_change: 0.2
  max_alignment_p_change: 0.1
  max_p_ci_width: 0.5
  bootstrap_repeats: 100
  max_monotonic_correction_total_n: 0.3
  min_validation_points: 6
  min_test_points: 6
  mean_relative_limit: 0.05
  max_relative_limit: 0.10
  low_force_absolute_limit_n: 0.03
  coverage_voltage_tolerance_v: 0.15
runtime:
  voltage_filter_time_constant_s: null
  max_voltage_sample_age_s: null
hardware_firmware_metadata:
  actual_firmware: unknown
  configuration_match: unknown
  voltage_compatibility_verified: false
  vbat_sag_compensation_disabled: unknown
